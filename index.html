<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Embodiment Practice Log</title>
<style>
  :root {
    --indigo: #2E2A5C;
    --sand: #F3ECE0;
    --black: #17161E;
    --white: #FFFFFF;
    --muted: #5F584F;
    --rule: rgba(23, 22, 30, 0.12);
    --field-border: rgba(46, 42, 92, 0.6);
    --indigo-tint: rgba(46, 42, 92, 0.06);
    --success: #2E7D5B;
    --warning: #B8860B;
    --error: #B3413A;
    --disabled: #AAA49B;
    --viz-1: #8A85C9;
    --viz-2: #5F5AA8;
    --viz-3: #2E2A5C;
    --sans: 'Hanken Grotesk', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sand);
    color: var(--black);
    font: 400 16px/1.6 var(--sans);
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 28px; line-height: 1.18; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.015em; color: var(--indigo); }
  header p { margin: 0 0 24px; color: var(--muted); font-size: 13px; font-weight: 500; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 24px; flex-wrap: wrap; }
  nav button {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
    min-height: 44px; padding: 0 14px; font: inherit; font-weight: 500; color: var(--muted);
    cursor: pointer; margin-bottom: -1px;
  }
  nav button:hover { color: var(--indigo); }
  nav button[aria-current="true"] { color: var(--indigo); border-bottom-color: var(--indigo); font-weight: 600; }
  .card { background: var(--white); border: 1px solid var(--rule); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  h2, h3 { font-size: 18px; line-height: 1.3; margin: 0 0 16px; font-weight: 500; color: var(--indigo); }
  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  input[type="text"], input[type="date"], select, textarea {
    width: 100%; min-height: 44px; padding: 9px 12px; font: inherit; color: var(--black);
    background: var(--white); border: 1px solid var(--field-border); border-radius: 6px;
  }
  textarea { resize: vertical; min-height: 88px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--indigo); outline-offset: 2px;
  }
  select:disabled { color: var(--muted); background: var(--indigo-tint); }
  .field { margin-bottom: 16px; }
  fieldset.field { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
  fieldset.field legend { padding: 0; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > .field { flex: 1 1 200px; }
  .parts { display: flex; gap: 8px; }
  .parts label {
    flex: 1 1 0; min-width: 0; min-height: 44px; margin: 0; padding: 0 6px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 1px solid var(--field-border); border-radius: 6px; background: var(--white);
    font-size: 15px; font-weight: 400; color: var(--black);
  }
  .parts input { position: absolute; width: 1px; height: 1px; margin: -1px; opacity: 0; }
  .parts label:has(input:checked) { background: var(--indigo); border-color: var(--indigo); color: var(--white); font-weight: 600; }
  .parts label:has(input:focus-visible) { outline: 2px solid var(--indigo); outline-offset: 2px; }
  button.primary {
    min-height: 44px; background: var(--indigo); color: var(--white); border: 0; border-radius: 6px;
    padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { background: var(--black); }
  button.primary:disabled { background: var(--disabled); cursor: not-allowed; }
  button.link {
    min-height: 44px; min-width: 44px; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; padding: 0 10px; border-radius: 6px;
  }
  button.link:hover { color: var(--error); background: rgba(179, 65, 58, 0.08); }
  .status { margin-left: 12px; font-size: 14px; font-weight: 500; color: var(--success); overflow-wrap: anywhere; }
  .status.error { color: var(--error); font-weight: 600; }
  .item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); }
  .item:first-child { border-top: 0; }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-weight: 600; color: var(--indigo); overflow-wrap: anywhere; }
  .item-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item-notes { margin-top: 8px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--black); }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 500; line-height: 1.4; padding: 1px 10px;
    border: 1px solid var(--indigo); border-radius: 20px; text-transform: capitalize;
  }
  .badge.morning { background: var(--sand); color: var(--indigo); border-color: var(--sand); }
  .badge.afternoon { background: var(--white); color: var(--indigo); }
  .badge.evening { background: var(--indigo); color: var(--white); }
  .empty { color: var(--muted); font-size: 15px; padding: 8px 0; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { flex: 1 1 120px; background: var(--indigo-tint); border-radius: 6px; padding: 14px 16px; }
  .stat-num { font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -0.015em; color: var(--indigo); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 15px; }
  .bar-name { flex: 0 0 34%; overflow-wrap: anywhere; }
  .bar-track { flex: 1; background: var(--indigo-tint); border-radius: 3px; height: 16px; overflow: hidden; }
  .bar-fill { background: var(--indigo); height: 100%; border-radius: 3px; min-width: 2px; }
  .bar-count { flex: 0 0 auto; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .days { display: flex; gap: 4px; flex-wrap: wrap; }
  .day { width: 26px; height: 26px; border-radius: 3px; border: 1px solid var(--rule); background: var(--white); }
  .day.l1 { background: var(--viz-1); border-color: var(--viz-1); }
  .day.l2 { background: var(--viz-2); border-color: var(--viz-2); }
  .day.l3 { background: var(--viz-3); border-color: var(--viz-3); }
  .legend { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .legend .day { width: 16px; height: 16px; }
  .warn {
    background: var(--white); border: 1px solid var(--warning); border-left-width: 4px; border-radius: 2px;
    color: var(--black); padding: 12px 16px; font-size: 15px; margin-bottom: 20px;
  }
  .warn strong { color: var(--black); }
  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    .bar-name { flex-basis: 40%; }
    .item { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Embodiment Practice Log</h1>
    <p>Saved in this browser on this computer only.</p>
  </header>

  <div class="warn" id="storage-warning" role="alert" hidden></div>

  <nav>
    <button type="button" data-view="log" aria-current="true">Log</button>
    <button type="button" data-view="practices" aria-current="false">Practices</button>
    <button type="button" data-view="dashboard" aria-current="false">Dashboard</button>
  </nav>

  <section id="view-log">
    <div class="card">
      <h2>Log a session</h2>
      <form id="session-form">
        <div class="row">
          <div class="field">
            <label for="session-practice">Practice</label>
            <select id="session-practice" required></select>
          </div>
          <div class="field">
            <label for="session-date">Date</label>
            <input type="date" id="session-date" required>
          </div>
        </div>
        <fieldset class="field">
          <legend>Part of day</legend>
          <div class="parts">
            <label><input type="radio" name="part" value="morning" checked> Morning</label>
            <label><input type="radio" name="part" value="afternoon"> Afternoon</label>
            <label><input type="radio" name="part" value="evening"> Evening</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="session-notes">Notes <span style="color:var(--muted);font-weight:400">— how it felt, what was present (optional)</span></label>
          <textarea id="session-notes" placeholder="Restless at first, softer by the end..."></textarea>
        </div>
        <button type="submit" class="primary" id="session-submit">Log session</button>
        <span class="status" id="session-status" role="status"></span>
      </form>
    </div>

    <div class="card">
      <h2>Your sessions</h2>
      <div id="session-list"></div>
    </div>
  </section>

  <section id="view-practices" hidden>
    <div class="card">
      <h2>Add a practice</h2>
      <form id="practice-form">
        <div class="field">
          <label for="practice-name">Name</label>
          <input type="text" id="practice-name" placeholder="Yoga, Vipassana, Wim Hof breathing..." required maxlength="60">
        </div>
        <button type="submit" class="primary" id="practice-submit">Add practice</button>
        <span class="status" id="practice-status" role="status"></span>
      </form>
    </div>

    <div class="card">
      <h2>Your practices</h2>
      <div id="practice-list"></div>
    </div>
  </section>

  <section id="view-dashboard" hidden>
    <div class="card">
      <div class="stats" id="dash-stats"></div>
    </div>
    <div class="card">
      <h3>Sessions per practice</h3>
      <div id="dash-practices"></div>
    </div>
    <div class="card">
      <h3>Rhythm of the day</h3>
      <div id="dash-parts"></div>
    </div>
    <div class="card">
      <h3>Last 30 days</h3>
      <div class="days" id="dash-days"></div>
      <div class="legend">
        <span>None</span>
        <span class="day"></span><span class="day l1"></span><span class="day l2"></span><span class="day l3"></span>
        <span>3+ sessions</span>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'embodiment-practice-log-v1';
  var PARTS = ['morning', 'afternoon', 'evening'];

  var WARNINGS = {
    unreadable: 'Your saved data could not be read, so the app has stopped saving to avoid ' +
      'overwriting it. Nothing has been deleted. Do not clear your browser data; the stored ' +
      'data may still be recoverable.',
    saveFailed: 'The browser refused to save your last change, so it was not kept. ' +
      'Everything saved before it is unaffected.'
  };

  var state = { practices: [], sessions: [] };
  var locked = false;

  function showWarning(message) {
    var box = document.getElementById('storage-warning');
    box.textContent = '';
    box.append(el('strong', { text: 'Warning: ' }), message);
    box.hidden = false;
  }

  // Returns null when stored data exists but cannot be read, so callers never overwrite it.
  function readStored() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw === null) return { practices: [], sessions: [] };
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.practices) && Array.isArray(parsed.sessions)) {
        return { practices: parsed.practices, sessions: parsed.sessions };
      }
    } catch (err) {}
    return null;
  }

  function refresh() {
    if (locked) return false;
    var stored = readStored();
    if (!stored) {
      locked = true;
      showWarning(WARNINGS.unreadable);
      return false;
    }
    state = stored;
    return true;
  }

  // Re-reads storage before every change so another open tab's work is never replaced.
  // The change callback returns false to cancel. Result: 'saved', 'cancelled' or 'failed'.
  function update(change) {
    if (!refresh()) {
      render();
      return 'failed';
    }
    if (change() === false) {
      render();
      return 'cancelled';
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      showWarning(WARNINGS.saveFailed);
      refresh();
      render();
      return 'failed';
    }
    document.getElementById('storage-warning').hidden = true;
    render();
    return 'saved';
  }

  function id() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // Built from local date parts: toISOString() converts to UTC and can land on the wrong day.
  function isoDate(d) {
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parseISO(s) {
    var p = s.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function formatDate(iso) {
    var today = isoDate(new Date());
    if (iso === today) return 'Today';
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (iso === isoDate(yesterday)) return 'Yesterday';
    return parseISO(iso).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  function el(tag, props, children) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (k === 'class') node.className = props[k];
      else if (k === 'text') node.textContent = props[k];
      else node.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) node.append(c); });
    return node;
  }

  function practiceName(practiceId) {
    var found = state.practices.find(function (p) { return p.id === practiceId; });
    return found ? found.name : 'Removed practice';
  }

  function sortedSessions() {
    var order = { evening: 2, afternoon: 1, morning: 0 };
    return state.sessions.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      if (a.part !== b.part) return order[b.part] - order[a.part];
      return b.createdAt - a.createdAt;
    });
  }

  function flash(node, message, isError) {
    clearTimeout(node.flashTimer);
    node.textContent = message;
    node.classList.toggle('error', Boolean(isError));
    if (!isError) node.flashTimer = setTimeout(function () { node.textContent = ''; }, 2500);
  }

  function renderPracticeSelect() {
    var select = document.getElementById('session-practice');
    var previous = select.value;
    select.textContent = '';
    document.getElementById('practice-submit').disabled = locked;
    if (!state.practices.length) {
      select.append(el('option', { value: '', text: 'No practices yet — add one first' }));
      select.disabled = true;
      document.getElementById('session-submit').disabled = true;
      return;
    }
    select.disabled = false;
    document.getElementById('session-submit').disabled = locked;
    state.practices.forEach(function (p) {
      select.append(el('option', { value: p.id, text: p.name }));
    });
    if (previous && state.practices.some(function (p) { return p.id === previous; })) select.value = previous;
  }

  function renderSessions() {
    var list = document.getElementById('session-list');
    list.textContent = '';
    var sessions = sortedSessions();
    if (locked) {
      list.append(el('p', { class: 'empty', text: 'Your sessions cannot be shown because the saved data could not be read.' }));
      return;
    }
    if (!sessions.length) {
      list.append(el('p', { class: 'empty', text: 'Nothing logged yet. Your sessions will appear here, newest first.' }));
      return;
    }
    sessions.forEach(function (s) {
      var main = el('div', { class: 'item-main' }, [
        el('div', { class: 'item-title', text: practiceName(s.practiceId) }),
        el('div', { class: 'item-meta' }, [
          document.createTextNode(formatDate(s.date) + ' '),
          el('span', { class: 'badge ' + s.part, text: s.part })
        ]),
        s.notes ? el('div', { class: 'item-notes', text: s.notes }) : null
      ]);
      var remove = el('button', { class: 'link', type: 'button', text: 'Delete' });
      remove.addEventListener('click', function () {
        if (!confirm('Delete this ' + practiceName(s.practiceId) + ' session? Its notes cannot be recovered.')) return;
        update(function () {
          state.sessions = state.sessions.filter(function (x) { return x.id !== s.id; });
        });
      });
      list.append(el('div', { class: 'item' }, [main, remove]));
    });
  }

  function renderPractices() {
    var list = document.getElementById('practice-list');
    list.textContent = '';
    if (!state.practices.length) {
      list.append(el('p', { class: 'empty', text: 'No practices yet. Add one above to start logging.' }));
      return;
    }
    function sessionCount(practiceId) {
      return state.sessions.filter(function (s) { return s.practiceId === practiceId; }).length;
    }
    state.practices.forEach(function (p) {
      var count = sessionCount(p.id);
      var main = el('div', { class: 'item-main' }, [
        el('div', { class: 'item-title', text: p.name }),
        el('div', { class: 'item-meta', text: count === 1 ? '1 session logged' : count + ' sessions logged' })
      ]);
      var remove = el('button', { class: 'link', type: 'button', text: 'Delete' });
      remove.addEventListener('click', function () {
        if (!refresh()) {
          render();
          return;
        }
        var current = sessionCount(p.id);
        var message = current
          ? 'Delete "' + p.name + '" and its ' + current + ' logged session' + (current === 1 ? '' : 's') + '? This cannot be undone.'
          : 'Delete "' + p.name + '"?';
        if (!confirm(message)) return;
        update(function () {
          state.practices = state.practices.filter(function (x) { return x.id !== p.id; });
          state.sessions = state.sessions.filter(function (s) { return s.practiceId !== p.id; });
        });
      });
      list.append(el('div', { class: 'item' }, [main, remove]));
    });
  }

  function barRow(name, count, max) {
    var pct = max ? Math.round((count / max) * 100) : 0;
    var fill = el('div', { class: 'bar-fill' });
    fill.style.width = pct + '%';
    return el('div', { class: 'bar-row' }, [
      el('div', { class: 'bar-name', text: name }),
      el('div', { class: 'bar-track' }, [fill]),
      el('div', { class: 'bar-count', text: String(count) })
    ]);
  }

  function renderDashboard() {
    var days = {};
    state.sessions.forEach(function (s) { days[s.date] = (days[s.date] || 0) + 1; });

    var stats = document.getElementById('dash-stats');
    stats.textContent = '';
    [
      [state.sessions.length, 'sessions logged'],
      [Object.keys(days).length, 'days practised'],
      [state.practices.length, 'practices']
    ].forEach(function (pair) {
      stats.append(el('div', { class: 'stat' }, [
        el('div', { class: 'stat-num', text: String(pair[0]) }),
        el('div', { class: 'stat-label', text: pair[1] })
      ]));
    });

    var perPractice = document.getElementById('dash-practices');
    perPractice.textContent = '';
    if (!state.practices.length) {
      perPractice.append(el('p', { class: 'empty', text: 'Add a practice to see totals here.' }));
    } else {
      var counts = state.practices.map(function (p) {
        return { name: p.name, count: state.sessions.filter(function (s) { return s.practiceId === p.id; }).length };
      }).sort(function (a, b) { return b.count - a.count; });
      var maxCount = Math.max.apply(null, counts.map(function (c) { return c.count; }).concat([1]));
      counts.forEach(function (c) { perPractice.append(barRow(c.name, c.count, maxCount)); });
    }

    var parts = document.getElementById('dash-parts');
    parts.textContent = '';
    var partCounts = PARTS.map(function (part) {
      return { part: part, count: state.sessions.filter(function (s) { return s.part === part; }).length };
    });
    var maxPart = Math.max.apply(null, partCounts.map(function (c) { return c.count; }).concat([1]));
    partCounts.forEach(function (c) {
      parts.append(barRow(c.part.charAt(0).toUpperCase() + c.part.slice(1), c.count, maxPart));
    });

    var strip = document.getElementById('dash-days');
    strip.textContent = '';
    for (var i = 29; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var iso = isoDate(d);
      var count = days[iso] || 0;
      var level = count === 0 ? '' : count === 1 ? ' l1' : count === 2 ? ' l2' : ' l3';
      strip.append(el('div', {
        class: 'day' + level,
        title: formatDate(iso) + ' — ' + (count === 1 ? '1 session' : count + ' sessions')
      }));
    }
  }

  var renderedDay = '';
  var autoFilledDate = '';

  function render() {
    renderedDay = isoDate(new Date());
    renderPracticeSelect();
    renderSessions();
    renderPractices();
    renderDashboard();
  }

  // Moves the date field to the new day after midnight, unless the user picked a date themselves.
  function syncToToday() {
    var input = document.getElementById('session-date');
    var today = isoDate(new Date());
    if (input.value === autoFilledDate) input.value = today;
    autoFilledDate = today;
    if (renderedDay !== today) render();
  }

  document.querySelectorAll('nav button').forEach(function (button) {
    button.addEventListener('click', function () {
      document.querySelectorAll('nav button').forEach(function (b) {
        b.setAttribute('aria-current', String(b === button));
      });
      ['log', 'practices', 'dashboard'].forEach(function (view) {
        document.getElementById('view-' + view).hidden = view !== button.dataset.view;
      });
    });
  });

  document.getElementById('practice-form').addEventListener('submit', function (event) {
    event.preventDefault();
    var input = document.getElementById('practice-name');
    var status = document.getElementById('practice-status');
    var name = input.value.trim();
    if (!name) return;
    var result = update(function () {
      var duplicate = state.practices.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); });
      if (duplicate) return false;
      state.practices.push({ id: id(), name: name, createdAt: Date.now() });
    });
    if (result === 'saved') {
      input.value = '';
      flash(status, 'Added.');
    } else if (result === 'cancelled') {
      flash(status, '"' + name + '" is already on your list.');
    } else {
      flash(status, 'Not saved. See the warning at the top of the page.', true);
    }
  });

  document.getElementById('session-form').addEventListener('submit', function (event) {
    event.preventDefault();
    syncToToday();
    var status = document.getElementById('session-status');
    var practiceId = document.getElementById('session-practice').value;
    var date = document.getElementById('session-date').value;
    if (!practiceId || !date) return;
    var result = update(function () {
      if (!state.practices.some(function (p) { return p.id === practiceId; })) return false;
      state.sessions.push({
        id: id(),
        practiceId: practiceId,
        date: date,
        part: document.querySelector('input[name="part"]:checked').value,
        notes: document.getElementById('session-notes').value.trim(),
        createdAt: Date.now()
      });
    });
    if (result === 'saved') {
      document.getElementById('session-notes').value = '';
      flash(status, 'Session logged.');
    } else if (result === 'cancelled') {
      flash(status, 'That practice was deleted in another tab. Pick a practice and try again.', true);
    } else {
      flash(status, 'Not saved. See the warning at the top of the page.', true);
    }
  });

  window.addEventListener('storage', function (event) {
    if (event.key !== STORAGE_KEY && event.key !== null) return;
    refresh();
    render();
  });
  document.addEventListener('visibilitychange', syncToToday);
  window.addEventListener('focus', syncToToday);
  setInterval(syncToToday, 60000);

  refresh();
  render();
  syncToToday();
})();
</script>
</body>
</html>
